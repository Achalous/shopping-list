<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>🛒 Shopping List</h1><div id="summary" class="meta"></div></header>
  <main>
    <form id="addForm" autocomplete="off">
      <input id="name" placeholder="Add an item, e.g. chicken breast" list="seen" required>
      <input id="qty" placeholder="Qty (optional)" aria-label="Quantity">
      <select id="aisle" aria-label="Aisle"></select>
      <button class="btn primary">Add</button>
    </form>
    <datalist id="seen"></datalist>
    <div id="list"></div>
    <p id="actions"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
